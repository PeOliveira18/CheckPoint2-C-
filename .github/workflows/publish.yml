name: publish

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ./sources/ExpenseHub.slnx

  publish:
    name: Publish images to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sources/ExpenseHub.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/peoliveira18/expensehub-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sources/ExpenseHub.Worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/peoliveira18/expensehub-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Imagens publicadas"
            echo ""
            echo "- \`ghcr.io/peoliveira18/expensehub-api:${{ github.sha }}\`"
            echo "- \`ghcr.io/peoliveira18/expensehub-worker:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
